# Example Nginx site for Cinder.
# On Debian and Ubuntu, prefer: sudo bash deploy/install.sh
# Copy to /etc/nginx/sites-available/cinder and symlink into sites-enabled.
# Replace files.example.com with your hostname before enabling HTTPS.

# Chunk downloads on /api/open are form bodies. Every other body is treated
# as an unlock attempt and gets the strict limit, so no Content-Type spelling
# can reach the unlock handler unthrottled.
map $http_content_type $cinder_unlock_key {
    default $binary_remote_addr;
    ~*^multipart/form-data "";
    ~*^application/x-www-form-urlencoded "";
}

# POSTs that reach the catch-all location are throttled too, in case a path
# variant ever routes to an API handler without matching the blocks below.
map $request_method $cinder_post_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $cinder_unlock_key zone=cinder_unlock:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cinder_open:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=cinder_seal:10m rate=20r/s;
limit_req_zone $cinder_post_key zone=cinder_post:10m rate=20r/s;

# Page loads, assets, and the seal lookup are GETs; they are limited per
# address too, since each page view reaches the database.
map $request_method $cinder_get_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}
limit_req_zone $cinder_get_key zone=cinder_get:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=cinder_conn:10m;

upstream cinder {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Redirect HTTP to HTTPS once certificates exist.
# For the first certificate request, see the README (certbot's nginx plugin
# can add this block for you).
server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://files.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.example.com;

    # Paths written by certbot. Adjust if you issue certificates yourself.
    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The app's URL parser turns "\" into "/", so "/api\open" would reach the
    # API while skipping the location blocks below. Refuse it here.
    if ($request_uri ~ "(\x5c|%5[cC])") { return 400; }

    # No path the app serves contains a percent-escape. nginx matches locations on
    # the decoded path while the app routes the raw one, so an escape such as
    # "/api/open%20" could otherwise land in a looser location. Refuse them all.
    if ($request_uri ~ "^[^?]*%") { return 400; }

    # One address may hold 40 requests at once; slow or stalled clients are dropped.
    limit_conn cinder_conn 40;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 20s;

    # Only upload chunks are large; every other body is a few kilobytes.
    client_max_body_size 64k;

    # Do not log query strings that might carry tokens.
    access_log /var/log/nginx/cinder.access.log combined;
    error_log  /var/log/nginx/cinder.error.log;

    # Prefix matches: any suffix ("/api/open;x", "/api/open.") stays here.
    location ~* ^/api/open {
        limit_req zone=cinder_open burst=200 nodelay;
        limit_req zone=cinder_unlock burst=5 nodelay;
        limit_req zone=cinder_get burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://cinder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* ^/api/seal {
        limit_req zone=cinder_seal burst=40 nodelay;
        limit_req zone=cinder_get burst=60 nodelay;
        client_max_body_size 8m;
        # Finishing a large seal copies gigabytes before it answers.
        limit_req_status 429;

        proxy_pass http://cinder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        limit_req zone=cinder_post burst=40 nodelay;
        limit_req zone=cinder_get burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://cinder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
