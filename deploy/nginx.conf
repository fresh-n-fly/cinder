# Example Nginx site for Cinder.
# On Debian and Ubuntu, prefer: sudo bash deploy/install.sh
# Copy to /etc/nginx/sites-available/cinder and symlink into sites-enabled.
# Replace files.example.com with your hostname before enabling HTTPS.

# JSON POSTs to /api/open are unlock attempts. Chunk downloads use multipart
# form data and are not counted by this narrow limit.
map $http_content_type $cinder_unlock_key {
    default "";
    ~*^application/json $binary_remote_addr;
}

limit_req_zone $cinder_unlock_key zone=cinder_unlock:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cinder_open:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=cinder_seal:10m rate=20r/s;

upstream cinder {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Redirect HTTP to HTTPS once certificates exist.
# For the first certificate request, see the README (certbot's nginx plugin
# can add this block for you).
server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://files.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.example.com;

    # Paths written by certbot. Adjust if you issue certificates yourself.
    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Uploads are sent in about 4 MB chunks, so a modest limit is enough.
    client_max_body_size 8m;

    # Do not log query strings that might carry tokens.
    access_log /var/log/nginx/cinder.access.log combined;
    error_log  /var/log/nginx/cinder.error.log;

    location ~* ^/api/open/?$ {
        limit_req zone=cinder_open burst=200 nodelay;
        limit_req zone=cinder_unlock burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://cinder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* ^/api/seal/?$ {
        limit_req zone=cinder_seal burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://cinder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://cinder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
